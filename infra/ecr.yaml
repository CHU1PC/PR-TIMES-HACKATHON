AWSTemplateFormatVersion: "2010-09-09"
Description: バックエンドのコンテナイメージ置き場. app スタックより先に作り, イメージを push してから app を作る

Parameters:
  NamePrefix:
    Type: String
    Default: prtimes-hackathon-2026summer

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${NamePrefix}-backend"
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      # 何度も push するので古い世代を溜めない
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "直近5世代だけ残す",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: !Ref NamePrefix

Outputs:
  RepositoryUri:
    Description: docker push する先
    Value: !GetAtt Repository.RepositoryUri
    Export:
      Name: !Sub "${AWS::StackName}-RepositoryUri"
